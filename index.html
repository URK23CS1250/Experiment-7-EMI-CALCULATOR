<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EMI Calculator</title>
  <style>
    /* ---------- page background ---------- */
    :root{
      --card-width: 360px;
      --accent1: #ff416c;
      --accent2: #ff4b2b;
      --title: #b83232;
    }
    html,body{
      height:100%;
      margin:0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(135deg, #f8db9b 0%, #f7b488 35%, #f6a37a 60%, #f7b692 100%);
      padding:20px;
    }

    /* ---------- card ---------- */
    .card{
      width:var(--card-width);
      background: #fff;
      border-radius: 14px;
      padding: 26px;
      box-shadow: 0 18px 50px rgba(18, 24, 32, 0.12);
      border: 1px solid rgba(0,0,0,0.03);
      position: relative;
    }

    .title-row{
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      margin-bottom:12px;
    }
    .emoji {
      font-size:28px;
      margin-bottom:6px;
    }
    h1{
      margin:0;
      font-size:20px;
      color:var(--title);
      letter-spacing:0.2px;
    }

    /* ---------- form fields ---------- */
    label{
      display:block;
      font-size:13px;
      margin-top:12px;
      margin-bottom:6px;
      color:#3b3b3b;
      font-weight:600;
    }
    input[type="number"], input[type="text"], select{
      width:100%;
      box-sizing:border-box;
      padding:11px 12px;
      border-radius:8px;
      border:1px solid #e6e6e6;
      font-size:14px;
      outline:none;
      transition: box-shadow .12s, border-color .12s;
    }
    input:focus, select:focus{
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      border-color: rgba(0,0,0,0.12);
    }

    /* ---------- button ---------- */
    .btn{
      margin-top:18px;
      width:100%;
      padding:11px 14px;
      border-radius:8px;
      border:0;
      cursor:pointer;
      font-weight:700;
      font-size:15px;
      color:white;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      box-shadow: 0 6px 18px rgba(255,75,43,0.18);
    }

    /* ---------- result ---------- */
    .result{
      margin-top:16px;
      background: #fbfbfb;
      border-radius:10px;
      padding:12px;
      text-align:center;
      font-weight:700;
      color:#23303b;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
    }

    /* small helper text */
    .muted{
      font-size:12px;
      color:#777;
      margin-top:6px;
    }

    /* mobile scaling */
    @media (max-width:420px){
      :root{ --card-width: 92vw; }
      .card{ padding:18px; }
    }
  </style>
</head>
<body>

  <div class="card" role="region" aria-label="EMI Calculator">
    <div class="title-row">
      <div class="emoji">💰</div>
      <h1>EMI Calculator</h1>
    </div>

    <form id="emiForm" onsubmit="return calculateEMI(event)">
      <label for="loan">Loan Amount (₹)</label>
      <input id="loan" type="number" min="0" step="any" placeholder="Enter Loan Amount" required />

      <label for="rate">Annual Interest Rate (%)</label>
      <input id="rate" type="number" min="0" step="any" placeholder="Enter Interest Rate" required />

      <label for="tenure">Loan Tenure (Months)</label>
      <input id="tenure" type="number" min="1" step="1" placeholder="Enter Loan Tenure" required />

      <button class="btn" type="submit">Calculate EMI</button>
    </form>

    <div id="outputPlaceholder" aria-live="polite" style="display:none;">
      <div id="result" class="result"></div>
      <div class="muted" id="breakdown"></div>
    </div>
  </div>

  <script>
    // Single-file JS for EMI calculation (kept small and simple)
    function fmt(num){
      // format number with commas and two decimals
      return Number(num).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
    }

    function calculateEMI(e){
      e.preventDefault();

      const P = parseFloat(document.getElementById('loan').value);
      const annualRate = parseFloat(document.getElementById('rate').value);
      const n = parseInt(document.getElementById('tenure').value, 10);

      if (isNaN(P) || isNaN(annualRate) || isNaN(n) || P<=0 || n<=0){
        alert('Please enter valid positive values for all fields.');
        return false;
      }

      const r = annualRate / 12 / 100; // monthly rate

      let emi;
      if (r === 0) {
        // zero-interest loan simple division
        emi = P / n;
      } else {
        const pow = Math.pow(1 + r, n);
        emi = (P * r * pow) / (pow - 1);
      }

      const totalPay = emi * n;
      const totalInterest = totalPay - P;

      document.getElementById('result').textContent = 'Your Monthly EMI: ₹' + fmt(emi);
      document.getElementById('breakdown').textContent =
        'Total Payment: ₹' + fmt(totalPay) + ' • Total Interest: ₹' + fmt(totalInterest);

      document.getElementById('outputPlaceholder').style.display = 'block';
      return false;
    }

    // Optional: prefill with example values
    // document.getElementById('loan').value = 500000;
    // document.getElementById('rate').value = 7.5;
    // document.getElementById('tenure').value = 60;
  </script>
</body>
</html>
